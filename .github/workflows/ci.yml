name: CI

on:
  push:
    branches: [moddable]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No game data or Microsoft software
        run: |
          found=$(git ls-files | grep -iE '\.(hpi|ufo|ccx|gp3|gaf|3do|tnt|cob|fbi|tdf|pcx|wav|exe|dll|lib|obj|ico|cur)$|^toolchain/|^orig/' | grep -v '^orig/[^/]*\.sha256$' || true)
          if [ -n "$found" ]; then
            echo "These files must not be committed:"
            echo "$found"
            exit 1
          fi

      - name: Comment lint
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/commentlint.py --all
          python3 tools/commentlint.py --data

      - name: Test the comment lint and strip tool
        run: |
          python3 tools/test_commentlint.py
          python3 tools/test_stripcomments.py

      - name: Test the save comparison
        run: python3 tools/test_savefile.py

      - name: Determinism lint
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 tools/determinismlint.py "origin/$BASE_REF...HEAD"

      - name: No direct calls between sim subsystems
        run: python3 tools/coupling.py --seams

      - name: No virtual calls between sim subsystems without an exception
        run: python3 tools/coupling.py --virtual --check

      - name: Platform headers stay in the host
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/hostlint.py --open-issues

      - name: Test the rename tool
        run: python3 tools/test_rename.py

      - name: Test the full-suite cadence tool
        run: python3 tools/test_fullgate.py

      - name: Test the notifier
        run: python3 tools/test_notify.py

      - name: Test the claimable-issues tool
        run: python3 tools/test_available.py

      - name: Test the module judge
        run: python3 tools/test_oraclegate.py

      - name: Replay schema
        run: |
          python3 tools/test_replayschema.py
          python3 tools/replayschema.py --check

      - name: Test the clean-room proxy and canary manifest
        run: python3 tools/test_cleanroom.py

      - name: Test the spec lint
        run: python3 tools/test_speclint.py

      - name: Test the quirk flag doc comments
        run: python3 tools/test_quirks.py

      - name: Data notes cite no line numbers
        run: |
          python3 tools/test_citecheck.py
          python3 tools/citecheck.py

      - name: Test the code map
        run: python3 tools/test_codemap.py

      - name: Test the oracle kit export
        run: python3 tools/test_oraclekit.py

      - name: Commands as events
        run: |
          python3 tools/test_commands.py
          python3 tools/commands.py --check

      - name: Test the files gate and its fixtures
        run: python3 tools/test_filesgate.py

      - name: Test the core gate
        run: python3 tools/test_coregate.py

      - name: Replayed subsystems
        run: |
          python3 tools/test_replay_subsystems.py
          python3 tools/replay_subsystems.py check

      - name: Check the sim globals block is current
        run: |
          python3 tools/test_simglobals.py
          python3 tools/simglobals.py --check

      - name: Test the lints, the replay tool and the multiplayer namespace
        run: |
          python3 tools/test_determinismlint.py
          python3 tools/test_hostlint.py
          python3 tools/test_playtest_netns.py
          python3 tools/test_replay.py

      - name: Every tool test has a CI step
        run: python3 tools/test_ci_coverage.py

  modern-compile:
    name: modern-compile
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.changed.outputs.run }}
    env:
      LLVM_VERSION: 22.1.8
      LLVM_SHA256: df0e1ecf16caf3489a272a5eea4eec9b0d82878f6477fa309504f918a0006384
      UV_VERSION: 0.12.19
      RUST_VERSION: 1.99.1
      WASM_TOOLS_VERSION: 1.262.0
      WASM_TOOLS_SHA256: 655b8df67d54c3ef9b52fc237c4e94bbfbb5f5f43825245cb0940a7002a9ed65
      BT_NO_ORIG: 1
      BT_NO_GHIDRA: 1
      BT_NO_ZLIB: 1
    steps:
      - name: Free the runner SDKs the job doesn't use
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether the modern build is affected
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/$BASE_REF...HEAD" |
              grep -qE '^(src/|tests/|include/|interfaces/|link/|lib/|cmake/|CMakeLists\.txt$|tools/setup_toolchain\.sh$|tools/sources\.py$|tools/rwsets\.py$|tools/test_rwsets\.py$|data/rwsets\.csv$|tools/hazards\.py$|tools/test_hazards\.py$|data/hazards\.csv$|tools/stateclasses\.py$|tools/test_stateclasses\.py$|tools/blockpointers\.py$|tools/test_blockpointers\.py$|data/block_pointers\.csv$|tools/simalloc\.py$|tools/test_simalloc\.py$|data/simalloc_allow\.csv$|tools/test_trace_coverage\.py$|tools/playtest\.py$|tools/test_playtest_dialogs\.py$|tools/tracediff\.py$|tools/traceschema\.py$|tools/test_traceschema\.py$|tools/tracerehash\.py$|tools/test_tracerehash\.py$|tools/tracedigest\.py$|tools/test_tracedigest\.py$|tools/viewblock\.py$|tools/test_viewblock\.py$|tools/testdata/tracerehash/|data/trace_schema\.json$|tools/test_tracediff\.py$|data/trace_coverage\.csv$|data/state_classes\.csv$|docs/state\.md$|tools/typedupes\.py$|tools/test_typedupes\.py$|data/type_dupes\.csv$|tools/refcheck\.py$|tools/layoutasserts\.py$|tools/oraclekit\.py$|tools/test_oraclekit\.py$|tools/oraclekit/|tools/test_layoutasserts\.py$|tools/refrewrite\.py$|tools/test_refrewrite\.py$|tools/testdata/refrewrite/|tools/test_refcheck\.py$|data/outside_pointers\.csv$|tools/layoutrefs\.py$|tools/test_layoutrefs\.py$|data/layout_refs\.csv$|tools/seamlink\.py$|tools/test_seamlink\.py$|tools/writercheck\.py$|tools/test_writercheck\.py$|tools/privatestate\.py$|tools/test_privatestate\.py$|data/access_reads/|data/access_saveload/|data/shadow_field_allow\.csv$|data/seam_exceptions\.csv$|\.github/workflows/ci\.yml$|tools/coupling\.py$|tools/subsystemsdoc\.py$|tools/test_subsystemsdoc\.py$|docs/subsystems\.md$|tools/abidiff\.py$|data/frozen_interfaces\.csv$|tools/test_abidiff\.py$|wasm/modules\.json$|tools/accesslog\.py$|tools/test_accesslog\.py$|tools/depclass\.py$|tools/test_depclass\.py$|tools/dependenciesdoc\.py$|tools/test_dependenciesdoc\.py$|docs/dependencies\.md$|tools/simeventsdoc\.py$|tools/test_simeventsdoc\.py$|docs/sim-events\.md$|tools/schedule\.py$|tools/test_schedule\.py$|docs/schedule\.md$|data/dependencies\.csv$|data/dependency_checks\.csv$|data/access/|tools/phaseclass\.py$|tools/test_phaseclass\.py$|data/phase_dependencies\.csv$|data/phase_boundaries\.csv$|data/presentation_feeds\.csv$|data/draws\.csv$|data/pass_reads\.csv$|data/access_phases/|tools/presreads\.py$|tools/test_presreads\.py$|data/presentation_reads\.csv$|data/view_reads\.csv$|docs/view\.md$|data/access_presentation/|tools/aliases\.py$|tools/test_aliases\.py$|data/initialiser_allow\.csv$|data/initialisers\.csv$|tools/test_coupling\.py$|data/subsystems\.csv$|data/coupling\.csv$|data/hazard_edges\.csv$|data/globals\.csv$|data/game_logic\.csv$|tools/headers\.py$|tools/test_headers\.py$|data/headers_left_out\.csv$|data/headers_no_self_include\.csv$|tools/coverage\.py$|tools/test_coverage\.py$|tools/fullgate\.py$|tools/test_fullgate\.py$|data/coverage\.csv$|tools/coverage_runtime\.sh$|tools/ci_replays\.sh$|tools/replayvtablealiases\.py$|tools/filesgate\.py$|tools/test_filesgate\.py$|tools/filesfixtures\.py$|reference/files/|tools/coregate\.py$|tools/coreadapter\.py$|tools/test_coregate\.py$|tools/corefixtures\.py$|tools/corecases/|reference/core/|tools/cleanroom/coresandbox\.py$|tools/x87lint\.py$|tools/test_x87lint\.py$|tools/ftollint\.py$|tools/test_ftollint\.py$|data/crt_calls\.csv$|tools/replay_subsystems\.py$|tools/tidy\.py$|tools/test_tidy\.py$|\.clang-tidy$|tools/callconvscan\.py$|tools/test_callconvscan\.py$|tools/reference\.py$|tools/eventdigest\.py$|tools/test_eventdigest\.py$|tools/displaylog\.py$|tools/test_displaylog\.py$|tools/test_reference\.py$|pyproject\.toml$|uv\.lock$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Name the runner image
        id: image
        if: steps.changed.outputs.run == 'true'
        run: echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Cache the downloaded packages
        if: steps.changed.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ steps.image.outputs.version }}-ninja-cmake-p7zip-cabextract-mingw-wabt-wine-v1

      - name: Point apt at a reachable Ubuntu mirror
        if: steps.changed.outputs.run == 'true'
        run: &apt-mirror |
          sudo tee /usr/local/bin/ci-apt-mirror > /dev/null <<'EOF'
          #!/usr/bin/env bash
          list=/etc/apt/apt-mirrors.txt
          saved=/etc/apt/apt-mirrors.ci
          if ! grep -rqs "mirror+file:$list" /etc/apt/sources.list /etc/apt/sources.list.d; then
            echo "apt reads no mirror list at $list; its sources stay as they are"
            exit 0
          fi
          [ -f "$saved" ] || cp "$list" "$saved"
          suite="$(. /etc/os-release && echo "$VERSION_CODENAME")-security"
          mirrors=$(cut -f1 "$saved")
          if [ "$(dpkg --print-architecture)" = amd64 ]; then
            mirrors="$mirrors http://archive.ubuntu.com/ubuntu/ https://mirrors.edge.kernel.org/ubuntu/ http://mirrors.mit.edu/ubuntu/"
          fi
          mirrors=$(echo "$mirrors" | tr ' ' '\n' | awk 'NF && !seen[$0]++')
          if [ "${1:-}" = --next ]; then
            current=$(head -n1 "$list" | cut -f1)
            before=
            after=
            seen=
            for mirror in $mirrors; do
              if [ "$mirror" = "$current" ]; then
                seen=1
              elif [ -n "$seen" ]; then
                after="$after $mirror"
              else
                before="$before $mirror"
              fi
            done
            mirrors="$after $before"
          fi
          for mirror in $mirrors; do
            if curl -fsS -o /dev/null --connect-timeout 10 --max-time 60 "${mirror%/}/dists/$suite/InRelease"; then
              echo "apt mirror: $mirror"
              echo "$mirror" > "$list"
              exit 0
            fi
            echo "::warning::Ubuntu mirror $mirror is unreachable"
          done
          echo "::warning::no other Ubuntu mirror is reachable; $list stays as it was"
          EOF
          sudo chmod 755 /usr/local/bin/ci-apt-mirror
          sudo ci-apt-mirror

      - name: Configure apt to keep and retry its downloads
        if: steps.changed.outputs.run == 'true'
        run: &apt-config |
          mkdir -p "$HOME/apt-archives/partial"
          sudo tee /etc/apt/apt.conf.d/99ci > /dev/null <<EOF
          Dir::Cache::Archives "$HOME/apt-archives";
          APT::Keep-Downloaded-Packages "true";
          Acquire::Retries "5";
          Acquire::http::Timeout "30";
          EOF
          sudo tee /usr/local/bin/ci-apt-install > /dev/null <<'EOF'
          #!/usr/bin/env bash
          pauses=(30 90)
          for try in 1 2 3; do
            if apt-get install -y --no-install-recommends "$@"; then
              exit 0
            fi
            if [ "$try" = 3 ]; then
              echo "::error::apt-get install $* failed $try times"
              exit 1
            fi
            pause=${pauses[try - 1]}
            echo "::warning::apt-get install $* failed (try $try of 3); retrying in ${pause}s on the next reachable mirror"
            sleep "$pause"
            if command -v ci-apt-mirror > /dev/null; then
              ci-apt-mirror --next
            fi
            apt-get update || echo "::warning::apt-get update failed; retrying with the package lists apt already has"
          done
          EOF
          sudo chmod 755 /usr/local/bin/ci-apt-install

      - name: Install packages
        if: steps.changed.outputs.run == 'true'
        run: |
          sudo apt-get update || echo "::warning::apt-get update failed; installing from the package lists apt already has"
          sudo ci-apt-install ninja-build cmake p7zip-full cabextract curl xz-utils
          sudo chown -R "$(id -u):$(id -g)" "$HOME/apt-archives"
          curl -LsSf "https://astral.sh/uv/$UV_VERSION/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache LLVM ${{ env.LLVM_VERSION }}
        id: llvm-cache
        if: steps.changed.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/llvm
          key: llvm-${{ runner.os }}-${{ env.LLVM_VERSION }}-${{ env.LLVM_SHA256 }}

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        if: steps.changed.outputs.run == 'true'
        env:
          LLVM_CACHE_HIT: ${{ steps.llvm-cache.outputs.cache-hit }}
        run: |
          if [ "$LLVM_CACHE_HIT" != true ]; then
            url="https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/LLVM-$LLVM_VERSION-Linux-X64.tar.xz"
            curl -fSL --retry 3 --connect-timeout 30 --max-time 600 -o "$RUNNER_TEMP/llvm.tar.xz" "$url"
            echo "$LLVM_SHA256  $RUNNER_TEMP/llvm.tar.xz" | sha256sum -c -
            mkdir -p "$HOME/llvm"
            tar -xJf "$RUNNER_TEMP/llvm.tar.xz" -C "$HOME/llvm" --strip-components=1 --wildcards '*/bin/*' '*/lib/*'
            rm "$RUNNER_TEMP/llvm.tar.xz"
          fi
          echo "$HOME/llvm/bin" >> "$GITHUB_PATH"

      - name: Cache the MSVC 5 toolchain
        if: steps.changed.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            toolchain
            ~/.cache/byte-tactics
          key: toolchain-${{ hashFiles('tools/setup_toolchain.sh') }}

      - name: Set up the toolchain
        if: steps.changed.outputs.run == 'true'
        run: tools/setup_toolchain.sh

      - name: Configure
        if: steps.changed.outputs.run == 'true'
        run: cmake -S . -B build/modern -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/clang-cl-i686.cmake -DBT_COMPILE_ONLY=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: clang-tidy on the added lines
        if: steps.changed.outputs.run == 'true' && github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          uv run tools/test_tidy.py
          uv run tools/tidy.py "origin/$BASE_REF...HEAD"

      - name: Compile the game, data, bitexact, block_test, ref_test, pathfinding_writer_test, economy_writer_test, features_writer_test, targeting_writer_test, los_radar_writer_test, map_writer_test, players_writer_test, ai_writer_test, units_writer_test, weapons_writer_test, orders_writer_test, movement_writer_test, scripts_writer_test, units_hash_test, request_guard_test, view_block_test, replay_test and replay_native_test
        if: steps.changed.outputs.run == 'true'
        run: cmake --build build/modern --target game data bitexact block_test ref_test pathfinding_writer_test economy_writer_test features_writer_test targeting_writer_test los_radar_writer_test map_writer_test players_writer_test ai_writer_test units_writer_test weapons_writer_test orders_writer_test movement_writer_test scripts_writer_test units_hash_test request_guard_test view_block_test replay_test replay_native_test

      - name: Check the vtable aliases of the replay link
        if: steps.changed.outputs.run == 'true'
        run: |
          ninja -C build/modern aliases.obj
          uv run tools/replayvtablealiases.py --check

      - name: Compile the game and data with the access log
        if: steps.changed.outputs.run == 'true'
        run: |
          cmake -S . -B build/access -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/clang-cl-i686.cmake -DBT_COMPILE_ONLY=ON -DBT_ACCESS_LOG=ON
          cmake --build build/access --target game data accesslog
          rm -rf build/access

      - name: Compile the game with coverage and check its link keeps no new initialiser
        if: steps.changed.outputs.run == 'true'
        run: |
          tools/coverage_runtime.sh
          cmake -S . -B build/coverage -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/clang-cl-i686.cmake -DBT_COMPILE_ONLY=ON -DBT_COVERAGE=ON
          ninja -C build/coverage aliases.obj
          rm -rf build/coverage

      - name: Check no CPU-dependent x87 instruction is reachable, and game logic converts through bx_ftol
        if: steps.changed.outputs.run == 'true'
        run: |
          uv run tools/test_x87lint.py
          uv run tools/test_ftollint.py
          env -u BT_NO_ZLIB tools/setup_toolchain.sh
          cmake -S . -B build/x87 -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/clang-cl-i686.cmake -DBT_COMPILE_ONLY=ON
          ninja -C build/x87 aliases.obj wasmloader
          ninja -C build/x87 $(ninja -C build/x87 -t inputs TotalA.exe | grep -vE '(^|/)TotalA\.res$|^\.$')
          link=$(ninja -C build/x87 -t commands TotalA.exe | tail -1 | sed 's# "\?[^ ]*TotalA\.res"\?##')
          bash -c "$link"
          uv run tools/x87lint.py --exe build/x87/TotalA.exe
          uv run tools/ftollint.py --exe build/x87/TotalA.exe
          rm -rf build/x87
          [ -L toolchain ] || rm -rf toolchain/thirdparty
          df -h .

      - name: Cache Rust ${{ env.RUST_VERSION }}
        if: steps.changed.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/${{ env.RUST_VERSION }}-x86_64-unknown-linux-gnu
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-${{ runner.os }}-${{ env.RUST_VERSION }}-wasm32-i686gnu-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-${{ env.RUST_VERSION }}-wasm32-i686gnu-

      - name: Install the WASM toolchain
        if: steps.changed.outputs.run == 'true'
        run: |
          sudo ci-apt-install gcc-mingw-w64-i686 wabt
          sudo chown -R "$(id -u):$(id -g)" "$HOME/apt-archives"
          installed=
          for attempt in 1 2 3; do
            if timeout 180 rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-unknown-unknown,i686-pc-windows-gnu; then
              installed=1
              break
            fi
            echo "rustup toolchain install: attempt $attempt failed or timed out"
          done
          [ -n "$installed" ]
          rustup default "$RUST_VERSION"
          url="https://github.com/bytecodealliance/wasm-tools/releases/download/v$WASM_TOOLS_VERSION/wasm-tools-$WASM_TOOLS_VERSION-x86_64-linux.tar.gz"
          curl -fSL --retry 3 --connect-timeout 30 --max-time 300 -o "$RUNNER_TEMP/wasm-tools.tar.gz" "$url"
          echo "$WASM_TOOLS_SHA256  $RUNNER_TEMP/wasm-tools.tar.gz" | sha256sum -c -
          mkdir -p build/tools/bin
          tar -xzf "$RUNNER_TEMP/wasm-tools.tar.gz" -C build/tools/bin --strip-components=1 "wasm-tools-$WASM_TOOLS_VERSION-x86_64-linux/wasm-tools"

      - name: Cache the WASM runtime build
        if: steps.changed.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: build/wasm_host/target
          key: wasm-host-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('tests/wasm/host/dll/**', 'tools/wasm_host.py') }}
          restore-keys: wasm-host-${{ runner.os }}-${{ env.RUST_VERSION }}-

      - name: Build the WASM runtime and the injected wind_meteors module
        if: steps.changed.outputs.run == 'true'
        run: |
          cmake --build build/modern --target wasm_runtime wasm_runtime_inject
          df -h /

      - name: Run block_test, ref_test, pathfinding_writer_test, economy_writer_test, features_writer_test, targeting_writer_test, los_radar_writer_test, map_writer_test, players_writer_test, ai_writer_test, units_writer_test, weapons_writer_test, orders_writer_test, movement_writer_test, scripts_writer_test, units_hash_test, request_guard_test, view_block_test, replay_test and the native and WASM replays under Wine
        if: steps.changed.outputs.run == 'true'
        env:
          WINEDEBUG: -all
          WINEPREFIX: ${{ runner.temp }}/wineprefix
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update || echo "::warning::apt-get update failed; installing from the package lists apt already has"
          sudo ci-apt-install wine wine32:i386
          sudo chown -R "$(id -u):$(id -g)" "$HOME/apt-archives"
          tools/ci_replays.sh build/modern wine

      - name: Judge the in-repo data loader and engine core with the files and core gates under Wine
        if: steps.changed.outputs.run == 'true'
        env:
          WINEDEBUG: -all
          WINEPREFIX: ${{ runner.temp }}/wineprefix
          BT_FILES_ADAPTER: ${{ github.workspace }}/build/files/files_adapter.exe
        run: |
          env -u BT_NO_ZLIB tools/setup_toolchain.sh
          cmake -S . -B build/files -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/clang-cl-i686.cmake -DBT_COMPILE_ONLY=ON
          cmake --build build/files --target files_adapter
          uv run tools/test_filesgate.py
          uv run tools/filesgate.py check --out build/files-gate
          cmake --build build/modern --target core_state_adapter core_wasm_adapter core_console_adapter core_runtime_adapter
          uv run tools/corefixtures.py check
          uv run tools/test_coregate.py
          uv run tools/coregate.py --trusted --out build/core-gate
          rm -rf build/files
          [ -L toolchain ] || rm -rf toolchain/thirdparty

      - name: Upload the replay binaries
        if: steps.changed.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: replay-binaries
          if-no-files-found: error
          path: |
            build/modern/block_test.exe
            build/modern/ref_test.exe
            build/modern/pathfinding_writer_test.exe
            build/modern/economy_writer_test.exe
            build/modern/features_writer_test.exe
            build/modern/view_block_test.exe
            build/modern/targeting_writer_test.exe
            build/modern/los_radar_writer_test.exe
            build/modern/map_writer_test.exe
            build/modern/players_writer_test.exe
            build/modern/ai_writer_test.exe
            build/modern/units_writer_test.exe
            build/modern/weapons_writer_test.exe
            build/modern/orders_writer_test.exe
            build/modern/movement_writer_test.exe
            build/modern/scripts_writer_test.exe
            build/modern/units_hash_test.exe
            build/modern/request_guard_test.exe
            build/modern/replay_test.exe
            build/modern/replay_native_test.exe
            build/modern/replay_inject_test.exe
            build/modern/wind_meteors.wasm
            build/modern/wind_meteors_inject.wasm
            build/modern/wasmtime_host.dll
            build/modern/modules.json

  data-checks:
    name: data-checks
    runs-on: ubuntu-24.04
    env:
      LLVM_VERSION: 22.1.8
      LLVM_SHA256: df0e1ecf16caf3489a272a5eea4eec9b0d82878f6477fa309504f918a0006384
      UV_VERSION: 0.12.19
      BT_NO_ORIG: 1
      BT_NO_GHIDRA: 1
      BT_NO_ZLIB: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether the modern build is affected
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/$BASE_REF...HEAD" |
              grep -qE '^(src/|tests/|include/|interfaces/|link/|lib/|cmake/|CMakeLists\.txt$|tools/setup_toolchain\.sh$|tools/sources\.py$|tools/astcache\.py$|tools/test_astcache\.py$|tools/rwsets\.py$|tools/test_rwsets\.py$|data/rwsets\.csv$|tools/hazards\.py$|tools/test_hazards\.py$|data/hazards\.csv$|tools/stateclasses\.py$|tools/test_stateclasses\.py$|tools/blockpointers\.py$|tools/test_blockpointers\.py$|data/block_pointers\.csv$|tools/simalloc\.py$|tools/test_simalloc\.py$|data/simalloc_allow\.csv$|tools/test_trace_coverage\.py$|tools/playtest\.py$|tools/test_playtest_dialogs\.py$|tools/tracediff\.py$|tools/traceschema\.py$|tools/test_traceschema\.py$|tools/tracerehash\.py$|tools/test_tracerehash\.py$|tools/tracedigest\.py$|tools/test_tracedigest\.py$|tools/test_matchsetup\.py$|reference/traces/|tools/viewblock\.py$|tools/test_viewblock\.py$|tools/testdata/tracerehash/|data/trace_schema\.json$|tools/test_tracediff\.py$|data/trace_coverage\.csv$|data/state_classes\.csv$|docs/state\.md$|tools/typedupes\.py$|tools/test_typedupes\.py$|data/type_dupes\.csv$|tools/refcheck\.py$|tools/layoutasserts\.py$|tools/oraclekit\.py$|tools/test_oraclekit\.py$|tools/oraclekit/|tools/test_layoutasserts\.py$|tools/refrewrite\.py$|tools/test_refrewrite\.py$|tools/testdata/refrewrite/|tools/test_refcheck\.py$|data/outside_pointers\.csv$|tools/layoutrefs\.py$|tools/test_layoutrefs\.py$|data/layout_refs\.csv$|tools/seamlink\.py$|tools/test_seamlink\.py$|tools/writercheck\.py$|tools/test_writercheck\.py$|tools/privatestate\.py$|tools/test_privatestate\.py$|data/access_reads/|data/access_saveload/|data/shadow_field_allow\.csv$|data/seam_exceptions\.csv$|\.github/workflows/ci\.yml$|tools/coupling\.py$|tools/subsystemsdoc\.py$|tools/test_subsystemsdoc\.py$|docs/subsystems\.md$|tools/abidiff\.py$|data/frozen_interfaces\.csv$|tools/coregate\.py$|reference/core/|tools/test_abidiff\.py$|wasm/modules\.json$|tools/accesslog\.py$|tools/test_accesslog\.py$|tools/depclass\.py$|tools/test_depclass\.py$|tools/dependenciesdoc\.py$|tools/test_dependenciesdoc\.py$|docs/dependencies\.md$|tools/simeventsdoc\.py$|tools/test_simeventsdoc\.py$|docs/sim-events\.md$|tools/schedule\.py$|tools/test_schedule\.py$|docs/schedule\.md$|data/dependencies\.csv$|data/dependency_checks\.csv$|data/access/|tools/phaseclass\.py$|tools/test_phaseclass\.py$|data/phase_dependencies\.csv$|data/phase_boundaries\.csv$|data/presentation_feeds\.csv$|data/draws\.csv$|data/pass_reads\.csv$|data/access_phases/|tools/presreads\.py$|tools/test_presreads\.py$|data/presentation_reads\.csv$|data/view_reads\.csv$|docs/view\.md$|data/access_presentation/|tools/aliases\.py$|tools/test_aliases\.py$|data/initialiser_allow\.csv$|data/initialisers\.csv$|tools/test_coupling\.py$|data/subsystems\.csv$|data/coupling\.csv$|data/hazard_edges\.csv$|data/globals\.csv$|data/game_logic\.csv$|tools/headers\.py$|tools/test_headers\.py$|data/headers_left_out\.csv$|data/headers_no_self_include\.csv$|tools/coverage\.py$|tools/test_coverage\.py$|tools/fullgate\.py$|tools/test_fullgate\.py$|data/coverage\.csv$|tools/coverage_runtime\.sh$|tools/ci_replays\.sh$|data/crt_semantics\.csv$|data/crt_calls\.csv$|tools/crtsemantics\.py$|tools/test_crtsemantics\.py$|tools/runtimevectors\.py$|tools/test_runtimevectors\.py$|tools/x87lint\.py$|tools/test_x87lint\.py$|tools/replay_subsystems\.py$|tools/tidy\.py$|tools/test_tidy\.py$|\.clang-tidy$|tools/callconvscan\.py$|tools/test_callconvscan\.py$|tools/reference\.py$|tools/eventdigest\.py$|tools/test_eventdigest\.py$|tools/displaylog\.py$|tools/test_displaylog\.py$|tools/test_reference\.py$|pyproject\.toml$|uv\.lock$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Name the runner image
        id: image
        if: steps.changed.outputs.run == 'true'
        run: echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Cache the downloaded packages
        if: steps.changed.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ steps.image.outputs.version }}-ninja-cmake-p7zip-cabextract-v1

      - name: Point apt at a reachable Ubuntu mirror
        if: steps.changed.outputs.run == 'true'
        run: *apt-mirror

      - name: Configure apt to keep and retry its downloads
        if: steps.changed.outputs.run == 'true'
        run: *apt-config

      - name: Install packages
        if: steps.changed.outputs.run == 'true'
        run: |
          sudo apt-get update || echo "::warning::apt-get update failed; installing from the package lists apt already has"
          sudo ci-apt-install ninja-build cmake p7zip-full cabextract curl xz-utils
          sudo chown -R "$(id -u):$(id -g)" "$HOME/apt-archives"
          curl -LsSf "https://astral.sh/uv/$UV_VERSION/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache LLVM ${{ env.LLVM_VERSION }}
        id: llvm-cache
        if: steps.changed.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/llvm
          key: llvm-${{ runner.os }}-${{ env.LLVM_VERSION }}-${{ env.LLVM_SHA256 }}

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        if: steps.changed.outputs.run == 'true'
        env:
          LLVM_CACHE_HIT: ${{ steps.llvm-cache.outputs.cache-hit }}
        run: |
          if [ "$LLVM_CACHE_HIT" != true ]; then
            url="https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/LLVM-$LLVM_VERSION-Linux-X64.tar.xz"
            curl -fSL --retry 3 --connect-timeout 30 --max-time 600 -o "$RUNNER_TEMP/llvm.tar.xz" "$url"
            echo "$LLVM_SHA256  $RUNNER_TEMP/llvm.tar.xz" | sha256sum -c -
            mkdir -p "$HOME/llvm"
            tar -xJf "$RUNNER_TEMP/llvm.tar.xz" -C "$HOME/llvm" --strip-components=1 --wildcards '*/bin/*' '*/lib/*'
            rm "$RUNNER_TEMP/llvm.tar.xz"
          fi
          echo "$HOME/llvm/bin" >> "$GITHUB_PATH"

      - name: Cache the MSVC 5 toolchain
        if: steps.changed.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            toolchain
            ~/.cache/byte-tactics
          key: toolchain-${{ hashFiles('tools/setup_toolchain.sh') }}

      - name: Set up the toolchain
        if: steps.changed.outputs.run == 'true'
        run: tools/setup_toolchain.sh

      - name: Configure
        if: steps.changed.outputs.run == 'true'
        run: cmake -S . -B build/modern -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/clang-cl-i686.cmake -DBT_COMPILE_ONLY=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Compile the game and data
        if: steps.changed.outputs.run == 'true'
        run: cmake --build build/modern --target game data

      - name: Fill the shared syntax-tree cache
        if: steps.changed.outputs.run == 'true'
        run: |
          uv run tools/test_astcache.py
          uv run tools/astcache.py fill --build-dir build/modern

      - name: Check data/rwsets.csv, hazards.csv, state_classes.csv and the raw pointers, in parallel
        if: steps.changed.outputs.run == 'true'
        run: |
          uv run python --version
          rwsets() {
            uv run tools/test_rwsets.py
            uv run tools/rwsets.py --check --build-dir build/modern
          }
          hazards() {
            uv run tools/test_hazards.py
            uv run tools/hazards.py --check --build-dir build/modern
            uv run tools/hazards.py --unchecked
          }
          state_classes() {
            uv run tools/test_stateclasses.py
            uv run tools/test_trace_coverage.py
            uv run tools/stateclasses.py --check --build-dir build/modern
            uv run tools/stateclasses.py --unclassified
            uv run tools/test_blockpointers.py
            uv run tools/blockpointers.py --check
            uv run tools/test_simalloc.py
            uv run tools/simalloc.py
          }
          raw_pointers() {
            uv run tools/test_refcheck.py
            uv run tools/refcheck.py --check --build-dir build/modern
            uv run tools/test_layoutasserts.py
            uv run tools/layoutasserts.py --check
            uv run tools/test_refrewrite.py
          }
          logs="$RUNNER_TEMP/data-checks"
          mkdir -p "$logs"
          checks=(rwsets hazards state_classes raw_pointers)
          pids=()
          for check in "${checks[@]}"; do
            ( set -e; "$check" ) > "$logs/$check.log" 2>&1 &
            pids+=("$!")
          done
          failed=0
          for i in "${!checks[@]}"; do
            if wait "${pids[$i]}"; then
              echo "::group::${checks[$i]}: passed"
            else
              echo "::group::${checks[$i]}: FAILED"
              failed=1
            fi
            cat "$logs/${checks[$i]}.log"
            echo "::endgroup::"
          done
          exit "$failed"

      - name: Check data/type_dupes.csv only shrinks
        if: steps.changed.outputs.run == 'true'
        run: |
          uv run tools/test_typedupes.py
          uv run tools/typedupes.py --check --build-dir build/modern

      - name: Check docs/schedule.md is current
        if: steps.changed.outputs.run == 'true'
        run: |
          uv run tools/test_schedule.py
          uv run tools/schedule.py --check --build-dir build/modern

      - name: Export the oracle data kit
        if: steps.changed.outputs.run == 'true'
        run: uv run tools/oraclekit.py export "$RUNNER_TEMP/kit" --untagged --build-dir build/modern

      - name: Check data/layout_refs.csv is current
        if: steps.changed.outputs.run == 'true'
        run: |
          uv run tools/test_layoutrefs.py
          uv run tools/layoutrefs.py --objects @build/modern/objects.rsp --check

      - name: Check each subsystem links through its seams
        if: steps.changed.outputs.run == 'true'
        run: |
          uv run tools/test_seamlink.py
          uv run tools/seamlink.py --objects @build/modern/objects.rsp --check
          uv run tools/seamlink.py --private-state
          uv run tools/seamlink.py --mission-record
          uv run tools/seamlink.py --pilot-seams

      - name: Check the state writer of pathfinding is pure, stateless and free of scenario logic
        if: steps.changed.outputs.run == 'true'
        run: |
          uv run tools/test_writercheck.py
          uv run tools/writercheck.py --objects @build/modern/objects.rsp --check

      - name: Check each function and global is declared once
        if: steps.changed.outputs.run == 'true'
        run: |
          uv run tools/test_headers.py
          uv run tools/headers.py --check

      - name: Interface ABI diff, and the frozen core headers and vectors
        if: steps.changed.outputs.run == 'true'
        run: |
          uv run tools/test_abidiff.py
          uv run tools/abidiff.py
          uv run tools/coregate.py --check-frozen

      - name: Test the dropped initialiser check
        if: steps.changed.outputs.run == 'true'
        run: uv run tools/test_aliases.py

      - name: Check data/presentation_reads.csv and data/view_reads.csv are current, and docs/view.md lists every presentation read
        if: steps.changed.outputs.run == 'true'
        run: |
          uv run tools/test_presreads.py
          uv run tools/presreads.py --check

      - name: Test the access log tool and its classifier
        if: steps.changed.outputs.run == 'true'
        run: uv run tools/test_accesslog.py

      - name: Check the classes of the edges between subsystems, across phases, of the draws and of the passes
        if: steps.changed.outputs.run == 'true'
        run: |
          uv run tools/test_depclass.py
          uv run tools/test_dependenciesdoc.py
          uv run tools/test_phaseclass.py
          uv run tools/depclass.py --check
          uv run tools/dependenciesdoc.py --check

      - name: Check pathfinding's state is private in the access log and its written state has no shadow field
        if: steps.changed.outputs.run == 'true'
        run: |
          uv run tools/test_privatestate.py
          uv run tools/privatestate.py --check

      - name: Test the coverage report
        if: steps.changed.outputs.run == 'true'
        run: uv run tools/test_coverage.py

      - name: Test the full gate cadence
        if: steps.changed.outputs.run == 'true'
        run: uv run tools/test_fullgate.py

      - name: Test the playtest dialog handling
        if: steps.changed.outputs.run == 'true'
        run: |
          uv run tools/test_playtest_dialogs.py
          uv run tools/test_tracediff.py

      - name: Check the trace schema files are current
        if: steps.changed.outputs.run == 'true'
        run: |
          uv run tools/test_traceschema.py
          uv run tools/traceschema.py --check

      - name: Check the trace rehash on a stored dump
        if: steps.changed.outputs.run == 'true'
        run: |
          uv run tools/test_tracerehash.py
          uv run tools/test_tracedigest.py
          uv run tools/test_viewblock.py
          uv run tools/tracerehash.py tools/testdata/tracerehash/orders-build-patrol-1.dump.txt.xz --trace tools/testdata/tracerehash/orders-build-patrol-1.trace.txt
          uv run tools/tracerehash.py tools/testdata/tracerehash/orders-build-patrol-24.dump.txt.xz --trace tools/testdata/tracerehash/orders-build-patrol-24.trace.txt
          uv run tools/tracerehash.py tools/testdata/tracerehash/orders-move-attack-100.dump.txt.xz --trace tools/testdata/tracerehash/orders-move-attack-100.trace.txt
          uv run tools/tracerehash.py tools/testdata/tracerehash/load-midgame-901.dump.txt.xz --trace tools/testdata/tracerehash/load-midgame-901.trace.txt

      - name: Check data/coupling.csv is current
        if: steps.changed.outputs.run == 'true'
        run: |
          uv run tools/test_coupling.py
          uv run tools/coupling.py --check
          uv run tools/test_subsystemsdoc.py
          uv run tools/subsystemsdoc.py --check
          uv run tools/test_simeventsdoc.py
          uv run tools/simeventsdoc.py --check

      - name: Check the kit's runtime vectors
        if: steps.changed.outputs.run == 'true'
        run: |
          python3 tools/test_runtimevectors.py
          python3 tools/runtimevectors.py check

      - name: Check data/crt_semantics.csv covers the C semantics calls
        if: steps.changed.outputs.run == 'true'
        run: |
          python3 tools/test_crtsemantics.py
          python3 tools/crtsemantics.py --check

      - name: Check no calling convention declares a member function
        if: steps.changed.outputs.run == 'true'
        run: |
          uv run tools/test_callconvscan.py
          uv run tools/callconvscan.py --check --no-asm

      - name: Test the reference tool
        if: steps.changed.outputs.run == 'true'
        run: |
          uv run tools/test_eventdigest.py
          uv run tools/test_displaylog.py
          uv run tools/test_reference.py

  replay-hosts:
    name: replay-hosts (${{ matrix.os }})
    needs: modern-compile
    if: needs.modern-compile.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Log the CPU
        shell: pwsh
        run: |
          Write-Output "PROCESSOR_IDENTIFIER=$env:PROCESSOR_IDENTIFIER"
          (Get-CimInstance Win32_Processor).Name

      - uses: actions/download-artifact@v4
        with:
          name: replay-binaries
          path: replay-binaries

      - name: Replay the recordings
        env:
          REPLAY_SELF_REPEAT: 10
        run: tools/ci_replays.sh replay-binaries

  wasm-modules:
    name: wasm-modules
    runs-on: ubuntu-24.04
    env:
      LLVM_VERSION: 22.1.8
      LLVM_SHA256: df0e1ecf16caf3489a272a5eea4eec9b0d82878f6477fa309504f918a0006384
      UV_VERSION: 0.12.19
      RUST_VERSION: 1.99.1
      WASM_TOOLS_VERSION: 1.262.0
      WASM_TOOLS_SHA256: 655b8df67d54c3ef9b52fc237c4e94bbfbb5f5f43825245cb0940a7002a9ed65
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf "https://astral.sh/uv/$UV_VERSION/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache LLVM ${{ env.LLVM_VERSION }}
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: ~/llvm
          key: llvm-${{ runner.os }}-${{ env.LLVM_VERSION }}-${{ env.LLVM_SHA256 }}

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        env:
          LLVM_CACHE_HIT: ${{ steps.llvm-cache.outputs.cache-hit }}
        run: |
          if [ "$LLVM_CACHE_HIT" != true ]; then
            url="https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/LLVM-$LLVM_VERSION-Linux-X64.tar.xz"
            curl -fSL --retry 3 --connect-timeout 30 --max-time 600 -o "$RUNNER_TEMP/llvm.tar.xz" "$url"
            echo "$LLVM_SHA256  $RUNNER_TEMP/llvm.tar.xz" | sha256sum -c -
            mkdir -p "$HOME/llvm"
            tar -xJf "$RUNNER_TEMP/llvm.tar.xz" -C "$HOME/llvm" --strip-components=1 --wildcards '*/bin/*' '*/lib/*'
            rm "$RUNNER_TEMP/llvm.tar.xz"
          fi
          echo "$HOME/llvm/bin" >> "$GITHUB_PATH"

      - name: Cache Rust ${{ env.RUST_VERSION }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/${{ env.RUST_VERSION }}-x86_64-unknown-linux-gnu
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-${{ runner.os }}-${{ env.RUST_VERSION }}-wasm32-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-${{ env.RUST_VERSION }}-wasm32-

      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          installed=
          for attempt in 1 2 3; do
            if timeout 180 rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-unknown-unknown; then
              installed=1
              break
            fi
            echo "rustup toolchain install: attempt $attempt failed or timed out"
          done
          [ -n "$installed" ]
          rustup default "$RUST_VERSION"

      - name: Install wasm-tools ${{ env.WASM_TOOLS_VERSION }}
        run: |
          url="https://github.com/bytecodealliance/wasm-tools/releases/download/v$WASM_TOOLS_VERSION/wasm-tools-$WASM_TOOLS_VERSION-x86_64-linux.tar.gz"
          curl -fSL --retry 3 --connect-timeout 30 --max-time 300 -o "$RUNNER_TEMP/wasm-tools.tar.gz" "$url"
          echo "$WASM_TOOLS_SHA256  $RUNNER_TEMP/wasm-tools.tar.gz" | sha256sum -c -
          mkdir -p build/tools/bin
          tar -xzf "$RUNNER_TEMP/wasm-tools.tar.gz" -C build/tools/bin --strip-components=1 "wasm-tools-$WASM_TOOLS_VERSION-x86_64-linux/wasm-tools"

      - name: Build the modules
        run: uv run tools/wasm_modules.py build

      - name: Run the fixtures
        run: uv run tools/wasm_modules.py check

      - name: Import allowlist
        run: uv run tools/wasm_modules.py imports

      - name: No hidden state in the module
        run: uv run tools/wasm_modules.py statics

      - name: Adapters across major bumps
        run: uv run tools/wasm_modules.py adapters

      - name: A module's fatal exits after the call
        run: uv run tools/wasm_modules.py fatal

      - name: Test the module tools
        run: uv run tools/test_wasm_modules.py

      - name: Test the fuel metering pass
        run: uv run tools/test_wasm_fuel.py

      - name: Test the embedded check loop
        run: uv run tools/test_wasm_loop.py

      - name: Test the host build options
        run: uv run tools/test_wasm_host.py

      - name: The module's maths against the native hashes
        run: |
          uv run tools/wasm_maths.py build --wasm-only
          uv run tools/wasm_maths.py check --wasm-only

  bitexact-portable:
    name: bitexact-portable (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    env:
      UV_VERSION: 0.12.19
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            configure: ""
          - name: linux-i686
            os: ubuntu-24.04
            configure: "-DCMAKE_C_FLAGS=-m32"
            multilib: true
          - name: linux-arm64
            os: ubuntu-24.04-arm
            configure: ""
          - name: macos-arm64
            os: macos-latest
            configure: ""
          - name: windows-x64
            os: windows-latest
            configure: "-A x64"
          - name: windows-win32
            os: windows-latest
            configure: "-A Win32"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}

      - name: Point apt at a reachable Ubuntu mirror
        if: matrix.multilib
        run: *apt-mirror

      - name: Configure apt to keep and retry its downloads
        if: matrix.multilib
        run: *apt-config

      - name: Install 32-bit support
        if: matrix.multilib
        run: |
          sudo apt-get update || echo "::warning::apt-get update failed; installing from the package lists apt already has"
          sudo ci-apt-install gcc-multilib

      - name: Configure
        shell: bash
        run: cmake -S lib/bitexact -B build/bxp -DCMAKE_BUILD_TYPE=Release ${{ matrix.configure }}

      - name: Build
        run: cmake --build build/bxp --config Release

      - name: Test
        run: ctest --test-dir build/bxp -C Release --output-on-failure
