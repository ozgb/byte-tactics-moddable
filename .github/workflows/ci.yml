name: CI

on:
  push:
    branches: [moddable]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No game data or Microsoft software
        run: |
          found=$(git ls-files | grep -iE '\.(hpi|ufo|ccx|gp3|gaf|3do|tnt|cob|fbi|tdf|pcx|wav|exe|dll|lib|obj|ico|cur)$|^toolchain/|^orig/' | grep -v '^orig/[^/]*\.sha256$' || true)
          if [ -n "$found" ]; then
            echo "These files must not be committed:"
            echo "$found"
            exit 1
          fi

      - name: Comment lint
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/commentlint.py --all

      - name: Test the comment lint and strip tool
        run: |
          python3 tools/test_commentlint.py
          python3 tools/test_stripcomments.py

      - name: Determinism lint
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 tools/determinismlint.py "origin/$BASE_REF...HEAD"

      - name: No direct calls between sim subsystems
        run: python3 tools/coupling.py --seams

      - name: Platform headers stay in the host
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/hostlint.py --open-issues

      - name: Test the rename tool
        run: python3 tools/test_rename.py

      - name: Data notes cite no line numbers
        run: |
          python3 tools/test_citecheck.py
          python3 tools/citecheck.py

  modern-compile:
    name: modern-compile
    runs-on: ubuntu-24.04
    env:
      LLVM_VERSION: 22.1.8
      LLVM_SHA256: df0e1ecf16caf3489a272a5eea4eec9b0d82878f6477fa309504f918a0006384
      UV_VERSION: 0.12.19
      BT_NO_ORIG: 1
      BT_NO_GHIDRA: 1
      BT_NO_ZLIB: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether the modern build is affected
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/$BASE_REF...HEAD" |
              grep -qE '^(src/|tests/|include/|interfaces/|link/|lib/|cmake/|CMakeLists\.txt$|tools/setup_toolchain\.sh$|tools/sources\.py$|tools/rwsets\.py$|tools/test_rwsets\.py$|data/rwsets\.csv$|tools/hazards\.py$|tools/test_hazards\.py$|data/hazards\.csv$|tools/stateclasses\.py$|tools/test_stateclasses\.py$|tools/blockpointers\.py$|tools/test_blockpointers\.py$|data/block_pointers\.csv$|tools/simalloc\.py$|tools/test_simalloc\.py$|data/simalloc_allow\.csv$|tools/test_trace_coverage\.py$|tools/playtest\.py$|tools/test_playtest_dialogs\.py$|tools/tracediff\.py$|tools/traceschema\.py$|tools/test_traceschema\.py$|tools/tracerehash\.py$|tools/test_tracerehash\.py$|tools/testdata/tracerehash/|data/trace_schema\.json$|tools/test_tracediff\.py$|data/trace_coverage\.csv$|data/state_classes\.csv$|tools/typedupes\.py$|tools/test_typedupes\.py$|data/type_dupes\.csv$|tools/refcheck\.py$|tools/layoutasserts\.py$|tools/test_layoutasserts\.py$|tools/refrewrite\.py$|tools/test_refrewrite\.py$|tools/testdata/refrewrite/|tools/test_refcheck\.py$|data/outside_pointers\.csv$|tools/layoutrefs\.py$|tools/test_layoutrefs\.py$|data/layout_refs\.csv$|tools/seamlink\.py$|tools/test_seamlink\.py$|data/seam_exceptions\.csv$|\.github/workflows/ci\.yml$|tools/coupling\.py$|tools/subsystemsdoc\.py$|tools/test_subsystemsdoc\.py$|docs/subsystems\.md$|tools/abidiff\.py$|tools/test_abidiff\.py$|wasm/modules\.json$|tools/aliases\.py$|tools/test_aliases\.py$|data/initialiser_allow\.csv$|tools/test_coupling\.py$|data/subsystems\.csv$|data/coupling\.csv$|data/hazard_edges\.csv$|data/globals\.csv$|data/game_logic\.csv$|tools/headers\.py$|tools/test_headers\.py$|data/headers_left_out\.csv$|data/headers_no_self_include\.csv$|tools/coverage\.py$|tools/test_coverage\.py$|data/coverage\.csv$|tools/coverage_runtime\.sh$|tools/tidy\.py$|tools/test_tidy\.py$|\.clang-tidy$|pyproject\.toml$|uv\.lock$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install packages
        if: steps.changed.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build cmake p7zip-full cabextract curl xz-utils
          curl -LsSf "https://astral.sh/uv/$UV_VERSION/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        if: steps.changed.outputs.run == 'true'
        run: |
          url="https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/LLVM-$LLVM_VERSION-Linux-X64.tar.xz"
          curl -fSL -o "$RUNNER_TEMP/llvm.tar.xz" "$url"
          echo "$LLVM_SHA256  $RUNNER_TEMP/llvm.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/llvm"
          tar -xJf "$RUNNER_TEMP/llvm.tar.xz" -C "$HOME/llvm" --strip-components=1 --wildcards '*/bin/*' '*/lib/*'
          rm "$RUNNER_TEMP/llvm.tar.xz"
          echo "$HOME/llvm/bin" >> "$GITHUB_PATH"

      - name: Cache the MSVC 5 toolchain
        if: steps.changed.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            toolchain
            ~/.cache/byte-tactics
          key: toolchain-${{ hashFiles('tools/setup_toolchain.sh') }}

      - name: Set up the toolchain
        if: steps.changed.outputs.run == 'true'
        run: tools/setup_toolchain.sh

      - name: Configure
        if: steps.changed.outputs.run == 'true'
        run: cmake -S . -B build/modern -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/clang-cl-i686.cmake -DBT_COMPILE_ONLY=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: clang-tidy on the added lines
        if: steps.changed.outputs.run == 'true' && github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          uv run tools/test_tidy.py
          uv run tools/tidy.py "origin/$BASE_REF...HEAD"

      - name: Compile the game, data, bitexact, block_test and ref_test
        if: steps.changed.outputs.run == 'true'
        run: cmake --build build/modern --target game data bitexact block_test ref_test

      - name: Check data/rwsets.csv is current
        if: steps.changed.outputs.run == 'true'
        run: |
          uv run tools/test_rwsets.py
          uv run tools/rwsets.py --check --build-dir build/modern

      - name: Check data/hazards.csv is current
        if: steps.changed.outputs.run == 'true'
        run: |
          uv run tools/test_hazards.py
          uv run tools/hazards.py --check --build-dir build/modern
          uv run tools/hazards.py --unchecked

      - name: Check data/state_classes.csv is current
        if: steps.changed.outputs.run == 'true'
        run: |
          uv run tools/test_stateclasses.py
          uv run tools/test_trace_coverage.py
          uv run tools/stateclasses.py --check --build-dir build/modern
          uv run tools/stateclasses.py --unclassified
          uv run tools/test_blockpointers.py
          uv run tools/blockpointers.py --check
          uv run tools/test_simalloc.py
          uv run tools/simalloc.py

      - name: Check data/type_dupes.csv only shrinks
        if: steps.changed.outputs.run == 'true'
        run: |
          uv run tools/test_typedupes.py
          uv run tools/typedupes.py --check --build-dir build/modern

      - name: Check no block struct gains a raw pointer
        if: steps.changed.outputs.run == 'true'
        run: |
          uv run tools/test_refcheck.py
          uv run tools/refcheck.py --check --build-dir build/modern
          uv run tools/test_layoutasserts.py
          uv run tools/layoutasserts.py --check
          uv run tools/test_refrewrite.py

      - name: Check data/layout_refs.csv is current
        if: steps.changed.outputs.run == 'true'
        run: |
          uv run tools/test_layoutrefs.py
          uv run tools/layoutrefs.py --objects @build/modern/objects.rsp --check

      - name: Check each subsystem links through its seams
        if: steps.changed.outputs.run == 'true'
        run: |
          uv run tools/test_seamlink.py
          uv run tools/seamlink.py --objects @build/modern/objects.rsp --check

      - name: Check each function and global is declared once
        if: steps.changed.outputs.run == 'true'
        run: |
          uv run tools/test_headers.py
          uv run tools/headers.py --check

      - name: Interface ABI diff
        if: steps.changed.outputs.run == 'true'
        run: |
          uv run tools/test_abidiff.py
          uv run tools/abidiff.py

      - name: Test the dropped initialiser check
        if: steps.changed.outputs.run == 'true'
        run: uv run tools/test_aliases.py

      - name: Test the coverage report
        if: steps.changed.outputs.run == 'true'
        run: uv run tools/test_coverage.py

      - name: Test the playtest dialog handling
        if: steps.changed.outputs.run == 'true'
        run: |
          uv run tools/test_playtest_dialogs.py
          uv run tools/test_tracediff.py

      - name: Check the trace schema files are current
        if: steps.changed.outputs.run == 'true'
        run: |
          uv run tools/test_traceschema.py
          uv run tools/traceschema.py --check

      - name: Check the trace rehash on a stored dump
        if: steps.changed.outputs.run == 'true'
        run: |
          uv run tools/test_tracerehash.py
          uv run tools/tracerehash.py tools/testdata/tracerehash/orders-build-patrol-1.dump.txt.xz --trace tools/testdata/tracerehash/orders-build-patrol-1.trace.txt
          uv run tools/tracerehash.py tools/testdata/tracerehash/orders-build-patrol-24.dump.txt.xz --trace tools/testdata/tracerehash/orders-build-patrol-24.trace.txt

      - name: Check data/coupling.csv is current
        if: steps.changed.outputs.run == 'true'
        run: |
          uv run tools/test_coupling.py
          uv run tools/coupling.py --check
          uv run tools/test_subsystemsdoc.py
          uv run tools/subsystemsdoc.py --check

  wasm-modules:
    name: wasm-modules
    runs-on: ubuntu-24.04
    env:
      LLVM_VERSION: 22.1.8
      LLVM_SHA256: df0e1ecf16caf3489a272a5eea4eec9b0d82878f6477fa309504f918a0006384
      UV_VERSION: 0.12.19
      RUST_VERSION: 1.99.1
      WASM_TOOLS_VERSION: 1.262.0
      WASM_TOOLS_SHA256: 655b8df67d54c3ef9b52fc237c4e94bbfbb5f5f43825245cb0940a7002a9ed65
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf "https://astral.sh/uv/$UV_VERSION/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        run: |
          url="https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/LLVM-$LLVM_VERSION-Linux-X64.tar.xz"
          curl -fSL -o "$RUNNER_TEMP/llvm.tar.xz" "$url"
          echo "$LLVM_SHA256  $RUNNER_TEMP/llvm.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/llvm"
          tar -xJf "$RUNNER_TEMP/llvm.tar.xz" -C "$HOME/llvm" --strip-components=1 --wildcards '*/bin/*' '*/lib/*'
          rm "$RUNNER_TEMP/llvm.tar.xz"
          echo "$HOME/llvm/bin" >> "$GITHUB_PATH"

      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"

      - name: Install wasm-tools ${{ env.WASM_TOOLS_VERSION }}
        run: |
          url="https://github.com/bytecodealliance/wasm-tools/releases/download/v$WASM_TOOLS_VERSION/wasm-tools-$WASM_TOOLS_VERSION-x86_64-linux.tar.gz"
          curl -fSL -o "$RUNNER_TEMP/wasm-tools.tar.gz" "$url"
          echo "$WASM_TOOLS_SHA256  $RUNNER_TEMP/wasm-tools.tar.gz" | sha256sum -c -
          mkdir -p build/tools/bin
          tar -xzf "$RUNNER_TEMP/wasm-tools.tar.gz" -C build/tools/bin --strip-components=1 "wasm-tools-$WASM_TOOLS_VERSION-x86_64-linux/wasm-tools"

      - name: Build the modules
        run: uv run tools/wasm_modules.py build

      - name: Run the fixtures
        run: uv run tools/wasm_modules.py check

      - name: Import allowlist
        run: uv run tools/wasm_modules.py imports

      - name: No hidden state in the module
        run: uv run tools/wasm_modules.py statics

      - name: Adapters across major bumps
        run: uv run tools/wasm_modules.py adapters

      - name: A module's fatal exits after the call
        run: uv run tools/wasm_modules.py fatal

      - name: Test the module tools
        run: uv run tools/test_wasm_modules.py

      - name: Test the fuel metering pass
        run: uv run tools/test_wasm_fuel.py

      - name: Test the embedded check loop
        run: uv run tools/test_wasm_loop.py

      - name: Test the host build options
        run: uv run tools/test_wasm_host.py

      - name: The module's maths against the native hashes
        run: |
          uv run tools/wasm_maths.py build --wasm-only
          uv run tools/wasm_maths.py check --wasm-only

  bitexact-portable:
    name: bitexact-portable (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    env:
      UV_VERSION: 0.12.19
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            configure: ""
          - name: linux-i686
            os: ubuntu-24.04
            configure: "-DCMAKE_C_FLAGS=-m32"
            multilib: true
          - name: linux-arm64
            os: ubuntu-24.04-arm
            configure: ""
          - name: macos-arm64
            os: macos-latest
            configure: ""
          - name: windows-x64
            os: windows-latest
            configure: "-A x64"
          - name: windows-win32
            os: windows-latest
            configure: "-A Win32"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install 32-bit support
        if: matrix.multilib
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-multilib

      - name: Configure
        shell: bash
        run: cmake -S lib/bitexact -B build/bxp -DCMAKE_BUILD_TYPE=Release ${{ matrix.configure }}

      - name: Build
        run: cmake --build build/bxp --config Release

      - name: Test
        run: ctest --test-dir build/bxp -C Release --output-on-failure
